<!DOCTYPE html>

<html lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-background": "#1a1c1e",
                    "outline": "#74777f",
                    "on-tertiary-fixed-variant": "#60410c",
                    "on-tertiary-fixed": "#291800",
                    "error": "#ba1a1a",
                    "surface-variant": "#e3e2e6",
                    "outline-variant": "#c4c6cf",
                    "secondary": "#226296",
                    "surface-container-high": "#e9e7eb",
                    "surface-container": "#eeedf1",
                    "surface-bright": "#faf9fc",
                    "on-surface-variant": "#43474e",
                    "surface-tint": "#455f87",
                    "secondary-fixed-dim": "#9bcbff",
                    "primary-fixed": "#d5e3ff",
                    "on-primary-fixed": "#001c3b",
                    "on-secondary": "#ffffff",
                    "on-secondary-fixed": "#001d34",
                    "surface-container-highest": "#e3e2e6",
                    "secondary-container": "#8bc3fd",
                    "on-secondary-fixed-variant": "#004a79",
                    "on-tertiary-container": "#c69b5f",
                    "inverse-surface": "#2f3033",
                    "surface-dim": "#dad9dd",
                    "on-tertiary": "#ffffff",
                    "error-container": "#ffdad6",
                    "on-secondary-container": "#005083",
                    "surface-container-low": "#f4f3f7",
                    "tertiary-container": "#503300",
                    "primary": "#022448",
                    "tertiary": "#341f00",
                    "primary-container": "#1e3a5f",
                    "tertiary-fixed-dim": "#edbf7f",
                    "secondary-fixed": "#d0e4ff",
                    "inverse-on-surface": "#f1f0f4",
                    "inverse-primary": "#adc8f5",
                    "on-error-container": "#93000a",
                    "primary-fixed-dim": "#adc8f5",
                    "surface": "#faf9fc",
                    "on-primary": "#ffffff",
                    "tertiary-fixed": "#ffddb2",
                    "background": "#faf9fc",
                    "on-primary-container": "#8aa4cf",
                    "surface-container-lowest": "#ffffff",
                    "on-primary-fixed-variant": "#2d486d",
                    "on-error": "#ffffff",
                    "on-surface": "#1a1c1e"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "base": "4px",
                    "md": "16px",
                    "gutter": "24px",
                    "lg": "24px",
                    "xl": "32px",
                    "sm": "8px",
                    "xs": "4px",
                    "container-margin": "40px"
            },
            "fontFamily": {
                    "data-tabular": ["Inter"],
                    "h3": ["Inter"],
                    "label-sm": ["Inter"],
                    "body-lg": ["Inter"],
                    "label-md": ["Inter"],
                    "h1": ["Inter"],
                    "body-sm": ["Inter"],
                    "body-md": ["Inter"],
                    "h2": ["Inter"]
            },
            "fontSize": {
                    "data-tabular": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                    "h3": ["20px", {"lineHeight": "28px", "letterSpacing": "0", "fontWeight": "600"}],
                    "label-sm": ["12px", {"lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "500"}],
                    "body-lg": ["16px", {"lineHeight": "24px", "letterSpacing": "0", "fontWeight": "400"}],
                    "label-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600"}],
                    "h1": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "body-sm": ["13px", {"lineHeight": "18px", "letterSpacing": "0", "fontWeight": "400"}],
                    "body-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0", "fontWeight": "400"}],
                    "h2": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600"}]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body { font-family: 'Inter', sans-serif; }
        .split-layout-shadow {
            box-shadow: 0 4px 12px rgba(30, 58, 95, 0.05);
        }
    </style>
</head>
<body class="bg-background text-on-background overflow-hidden">
<main class="flex min-h-screen w-full">
<!-- LEFT HALF: Brand Side (45%) -->
<section class="hidden lg:flex lg:w-[45%] bg-primary-container relative flex-col justify-between p-container-margin overflow-hidden">
<!-- Branding -->
<div class="z-10 flex items-center gap-sm">
<span class="material-symbols-outlined text-on-primary-container text-[32px]" data-icon="verified" style="font-variation-settings: 'FILL' 1;">verified</span>
<span class="font-h2 text-h2 text-white">AsistControl</span>
</div>
<!-- Content Center -->
<div class="z-10 max-w-md">
<h1 class="font-h1 text-h1 text-white mb-md leading-tight">Control de asistencia para tu negocio</h1>
<p class="font-body-lg text-body-lg text-on-primary-container mb-xl opacity-90">Gestiona empleados, turnos y reportes desde un solo lugar</p>
<!-- Abstract Illustration Placeholder -->
<div class="relative w-full aspect-square rounded-xl overflow-hidden bg-primary shadow-2xl">
<img alt="Dashboard Data Visualization" class="w-full h-full object-cover mix-blend-overlay opacity-60" data-alt="An abstract, high-end 3D visualization of corporate data growth and attendance metrics. The scene features glowing blue glass bars and holographic interfaces floating in a deep navy blue void, reflecting the sophisticated aesthetic of the AsistControl brand. Soft cyan and white light trails weave through the composition, creating a sense of dynamic movement and professional precision. The lighting is low-key with high-contrast highlights, emphasizing a futuristic SaaS environment." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCDkXUXkXAu6B3-o0IlS1xLFwAD0nGRXA669-eC7aeqhpEvjp4uL8_R8HnoNaCJ6NjK4KaXTMmDOc9cTL8RSPOSbxFtZxhFPMcMCyFmhqW2DcE0QhITq20e7m_S6-vZUxqbXhExDIR5T-Jkxk_zETSTJaWMqEQRVnIXXOPMOkDgjnmIKnODb781yY-n1J28u2vV5V25elrvYkB2Ry1s4EXkGXOjuDe27XQeUpS5ldJP5Eng2sATz-FuAP7pa-OuzkIWMGbOMre5GSg"/>
<div class="absolute inset-0 bg-gradient-to-t from-primary/80 to-transparent"></div>
</div>
</div>
<!-- Version Footer -->
<div class="z-10">
<p class="font-label-sm text-label-sm text-on-primary-container/60">v2.0 — AsistControl</p>
</div>
<!-- Background Decorative Elements -->
<div class="absolute -bottom-24 -left-24 w-96 h-96 bg-primary rounded-full blur-[120px] opacity-40"></div>
<div class="absolute top-1/4 -right-12 w-64 h-64 bg-on-primary-container/20 rounded-full blur-[80px]"></div>
</section>
<!-- RIGHT HALF: Login Form (55%) -->
<section class="w-full lg:w-[55%] flex flex-col justify-center items-center bg-surface-container-lowest px-gutter">
<!-- Mobile Branding (Visible only on small screens) -->
<div class="lg:hidden absolute top-xl left-xl flex items-center gap-xs">
<span class="material-symbols-outlined text-primary text-[28px]" data-icon="verified" style="font-variation-settings: 'FILL' 1;">verified</span>
<span class="font-h3 text-h3 text-primary">AsistControl</span>
</div>
<div class="w-full max-w-[420px] py-xl">
<!-- Header -->
<div class="mb-xl">
<h2 class="font-h2 text-h2 text-on-background mb-xs">Acceso administrador</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Ingresa con tus credenciales</p>
</div>
<!-- Form -->
<form class="space-y-lg">
<!-- User Field -->
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant" for="username">Usuario o correo</label>
<div class="relative group">
<input class="w-full h-12 px-md pt-base rounded-xl border border-outline-variant bg-white text-on-background font-body-md focus:outline-none focus:ring-2 focus:ring-secondary/20 focus:border-secondary transition-all" id="username" placeholder="nombre@empresa.com" type="text"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant" for="password">Contraseña</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline-variant group-focus-within:text-secondary transition-colors" data-icon="lock">lock</span>
<input class="w-full h-12 pl-xl pr-[52px] pt-base rounded-xl border border-outline-variant bg-white text-on-background font-body-md focus:outline-none focus:ring-2 focus:ring-secondary/20 focus:border-secondary transition-all" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-md top-1/2 -translate-y-1/2 text-outline hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- Forgot Password -->
<div class="flex justify-end">
<a class="font-label-md text-label-md text-secondary hover:underline transition-all" href="#">¿Olvidaste tu contraseña?</a>
</div>
<!-- Submit Button -->
<button class="w-full h-[52px] bg-primary-container text-white font-label-md text-[16px] rounded-xl shadow-md hover:shadow-lg hover:brightness-110 active:scale-[0.98] transition-all flex items-center justify-center gap-sm" type="submit">
                        Ingresar
                    </button>
</form>
<!-- Support Footer -->
<div class="mt-container-margin pt-lg border-t border-outline-variant flex flex-col items-center gap-xs">
<p class="font-body-sm text-body-sm text-on-surface-variant">¿Problemas de acceso?</p>
<a class="font-label-md text-label-md text-primary font-bold hover:text-secondary transition-colors" href="#">Contacta soporte</a>
</div>
</div>
</section>
</main>
<!-- Global Layout Decorative Background (Subtle) -->
<div class="fixed inset-0 pointer-events-none z-[-1] bg-surface">
<div class="absolute top-0 right-0 w-1/3 h-1/3 bg-primary/5 rounded-full blur-[100px]"></div>
</div>
</body></html>
